name: CI

on:
  push:
    branches:
      - main
      - dev
      - feature/peerjs-web-client
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Apply deterministic bridge-ready patch
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: node tool/apply-peerjs-bridge-ready-patch.mjs

      - name: Commit deterministic bridge-ready patch
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          if git diff --quiet -- src/peer/PeerJsGameTransport.ts src/peer/PeerJsGameTransport.test.ts; then
            echo "Bridge-ready patch is already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/peer/PeerJsGameTransport.ts src/peer/PeerJsGameTransport.test.ts
            git commit -m "fix: wait for PeerJS host bridge readiness"
            git push origin HEAD:dev
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
