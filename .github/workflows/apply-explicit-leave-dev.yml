name: Apply explicit leave dev update

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/apply-explicit-leave-dev.yml

permissions:
  contents: write

concurrency:
  group: apply-explicit-leave-dev
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply explicit leave change
        run: python3 scripts/apply_explicit_leave_dev.py

      - name: Remove one-shot updater
        run: rm .github/workflows/apply-explicit-leave-dev.yml scripts/apply_explicit_leave_dev.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add explicit leave flow for web client"
          git push origin HEAD:dev
