name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify published application
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
          const pageUrl = process.env.PAGE_URL;
          const repository = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const apiUrl = process.env.GITHUB_API_URL;
          const token = process.env.GITHUB_TOKEN;

          let verified = false;
          let failureReason = 'Published application did not become available in time.';

          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const pageResponse = await fetch(pageUrl, { redirect: 'follow' });
              if (!pageResponse.ok) {
                throw new Error(`HTML returned HTTP ${pageResponse.status}`);
              }

              const html = await pageResponse.text();
              if (!html.includes('id="root"')) {
                throw new Error('HTML does not contain the React root element');
              }

              const scriptMatch = html.match(/<script[^>]+src=["']([^"']+\.js)["']/i);
              if (!scriptMatch) {
                throw new Error('HTML does not reference the production JavaScript bundle');
              }

              const assetUrl = new URL(scriptMatch[1], pageUrl);
              const assetResponse = await fetch(assetUrl, { redirect: 'follow' });
              if (!assetResponse.ok) {
                throw new Error(`JavaScript bundle returned HTTP ${assetResponse.status}`);
              }

              verified = true;
              break;
            } catch (error) {
              failureReason = error instanceof Error ? error.message : String(error);
              console.log(`Verification attempt ${attempt}/12 failed: ${failureReason}`);
              if (attempt < 12) {
                await sleep(5_000);
              }
            }
          }

          const state = verified ? 'success' : 'failure';
          const description = verified
            ? 'GitHub Pages application is live.'
            : 'GitHub Pages live verification failed.';

          const statusResponse = await fetch(`${apiUrl}/repos/${repository}/statuses/${sha}`, {
            method: 'POST',
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${token}`,
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              state,
              target_url: pageUrl,
              description,
              context: 'pages/live-check',
            }),
          });

          if (!statusResponse.ok) {
            throw new Error(`Could not publish commit status: HTTP ${statusResponse.status}`);
          }

          if (!verified) {
            throw new Error(failureReason);
          }

          console.log(`Verified HTML and JavaScript bundle at ${pageUrl}`);
          NODE
